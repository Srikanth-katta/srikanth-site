<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision"><title id="title">Animated low-poly mountain with one snowy peak</title><desc id="desc">A single sharp low-poly mountain peak with a white snow cap. The polygon facets animate inward to assemble into the final mountain.</desc><style>
.piece {
  opacity: 1;
  transform-box: fill-box;
  transform-origin: center;
  animation: assemble var(--dur,1.1s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay,0s) both;
  will-change: transform, opacity;
}
@keyframes assemble {
  0% {
    opacity: 0;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg)) scale(var(--scale, 1));
  }
  62% { opacity: 1; }
  86% {
    opacity: 1;
    transform: translate(calc(var(--dx, 0px) * -0.035), calc(var(--dy, 0px) * -0.035)) rotate(calc(var(--rot, 0deg) * -0.03)) scale(1.012);
  }
  100% {
    opacity: 1;
    transform: translate(0px, 0px) rotate(0deg) scale(1);
  }
}
</style><g id="single-peak-mountain" fill-rule="evenodd"><polygon points="96,858 512,78 382,360" fill="#86acd8" class="piece" style="--dx:-299px;--dy:-35px;--rot:29deg;--scale:1.131;--delay:0.537s;--dur:0.971s;" /><polygon points="96,858 382,360 310,560" fill="#6d98c8" class="piece" style="--dx:319px;--dy:52px;--rot:-33deg;--scale:0.946;--delay:0.139s;--dur:0.867s;" /><polygon points="96,858 310,560 238,738" fill="#436f9f" class="piece" style="--dx:156px;--dy:-312px;--rot:5deg;--scale:0.722;--delay:0.023s;--dur:1.095s;" /><polygon points="96,858 238,738 216,908" fill="#14375f" class="piece" style="--dx:148px;--dy:206px;--rot:-84deg;--scale:1.063;--delay:0.583s;--dur:1.1s;" /><polygon points="512,78 640,360 928,858" fill="#7ba4d0" class="piece" style="--dx:-321px;--dy:-111px;--rot:36deg;--scale:1.11;--delay:0.067s;--dur:0.868s;" /><polygon points="640,360 720,560 928,858" fill="#5c86b8" class="piece" style="--dx:205px;--dy:58px;--rot:5deg;--scale:0.889;--delay:0.736s;--dur:1.11s;" /><polygon points="720,560 802,730 928,858" fill="#356397" class="piece" style="--dx:-54px;--dy:-377px;--rot:-75deg;--scale:1.236;--delay:0.393s;--dur:1.3s;" /><polygon points="802,730 832,908 928,858" fill="#12365e" class="piece" style="--dx:-52px;--dy:184px;--rot:114deg;--scale:1.001;--delay:0.539s;--dur:1.031s;" /><polygon points="512,78 382,360 456,306" fill="#ffffff" class="piece" style="--dx:-238px;--dy:127px;--rot:-101deg;--scale:1.0;--delay:0.406s;--dur:1.162s;" /><polygon points="512,78 456,306 506,252" fill="#f7fbff" class="piece" style="--dx:200px;--dy:-144px;--rot:-46deg;--scale:1.051;--delay:0.495s;--dur:1.18s;" /><polygon points="512,78 506,252 552,274" fill="#eef6fd" class="piece" style="--dx:49px;--dy:-253px;--rot:116deg;--scale:0.9;--delay:0.409s;--dur:0.986s;" /><polygon points="512,78 552,274 640,360" fill="#dceaf7" class="piece" style="--dx:169px;--dy:178px;--rot:39deg;--scale:1.078;--delay:0.164s;--dur:1.173s;" /><polygon points="456,306 506,252 486,392" fill="#edf5fb" 