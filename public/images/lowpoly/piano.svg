<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision"><title id="title">Low-poly upright piano</title><desc id="desc">A clean low-poly upright piano made from flat polygon shapes with a transparent background.</desc><style>
.piece {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: assemble var(--dur,1.15s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay,0s) forwards;
  will-change: transform, opacity;
}
@keyframes assemble {
  0% {
    opacity: 0;
    transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg)) scale(var(--scale, 1));
  }
  58% { opacity: 1; }
  82% {
    opacity: 1;
    transform: translate(calc(var(--dx, 0px) * -0.045), calc(var(--dy, 0px) * -0.045)) rotate(calc(var(--rot, 0deg) * -0.04)) scale(1.015);
  }
  100% {
    opacity: 1;
    transform: translate(0px, 0px) rotate(0deg) scale(1);
  }
}
